<!doctype html>
<html lang="dn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gebäudemanager</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="addattachment.css" />
    <script src="app.js" defer></script>
  </head>

  <body>
    <header>
      <div class="logo-header">
        <a href="index.html"><img src="./assets/img/logo.png" alt="logo" /></a>
        <p>Gebäudemanager</p>
      </div>
      <nav>
        <a href="./SearchAttachment.html">Anlangen Suchen</a
        ><a href="./roomcheck.html">Räume prüfen</a
        ><a href="./AddAttachment.html">Anlangen Hinzufügen</a
        ><a href="import.html">Import/Export</a>
      </nav>
    </header>

    <main>
      <div class="container">
        <h1>Anlage hinzufügen</h1>

        <form>
          <!-- Werk -->
          <div class="form-group">
            <label for="werk">Werk</label>
            <select id="werk" required>
              <option value="">Bitte wählen</option>
              <option value="50">Werk 50</option>
              <option value="59">Werk 59</option>
            </select>
          </div>

          <!-- Gebäude -->
          <div class="form-group">
            <label for="gebaeude">Gebäude</label>
            <input type="text" id="gebaeude" placeholder="z.B. 84" required />
          </div>

          <!-- Fachbereich -->
          <div class="form-group">
            <label for="fachbereich">Fachbereich</label>
            <select id="fachbereich" required>
              <option value="">Bitte wählen</option>
              <option>Elektro</option>
              <option>Sanitär</option>
              <option>Kältetechnik</option>
              <option>Schlosser</option>
            </select>
          </div>

          <!-- Funktion -->
          <div class="form-group">
            <label for="funktion">Funktion</label>
            <input
              type="text"
              id="funktion"
              placeholder="z.B. RWA, Tür, Fenster..."
              required
            />
          </div>

          <!-- Anlagenname -->
          <div class="form-group">
            <label for="anlage">Anlagenname / Nummer</label>
            <input
              type="text"
              id="anlage"
              placeholder="z.B. Herren Wc oder 80.140.923"
              required
            />
          </div>

          <!-- Raum -->
          <div class="form-group">
            <label for="raum">Raumbezeichnung</label>
            <input type="text" id="raum" placeholder="z.B. Raum 101" />
          </div>

          <!-- Pfeiler -->
          <div class="form-group">
            <label for="pfeiler">Pfeiler (optional)</label>
            <input type="text" id="pfeiler" placeholder="z.B. P12" />
          </div>

          <!-- Treppenhaus -->
          <div class="form-group">
            <label for="treppenhaus">Treppenhaus (1–20)</label>
            <input
              type="number"
              id="treppenhaus"
              min="1"
              max="20"
              placeholder="z.B. 3"
            />
          </div>

          <button type="submit">Speichern</button>
        </form>
      </div>
    </main>
  </body>
</html>
