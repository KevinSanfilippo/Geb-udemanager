<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gebäudemanager 1.0</title>

    <style>
      body {
        font-family: Arial;
        padding: 10px;
      }
      h2 {
        margin-top: 20px;
      }
      input,
      select,
      button {
        margin: 5px 0;
        padding: 8px;
        width: 100%;
      }
      .card {
        border: 1px solid #ccc;
        padding: 10px;
        margin: 5px 0;
      }
    </style>
  </head>

  <body>
    <h1>Gebäudemanager 1.0</h1>

    <!-- ========================= -->
    <h2>1. Anlage suchen</h2>

    <input id="searchText" placeholder="z.B. 26.140 oder Zuluft" />
    <select id="filterWork"></select>
    <select id="filterBuilding"></select>
    <select id="filterType">
      <option value="">Alle Typen</option>
      <option>UV</option>
      <option>FI</option>
      <option>Zuluft</option>
      <option>Abluft</option>
    </select>

    <button onclick="searchSystems()">Suchen</button>

    <div id="systemResults"></div>

    <!-- ========================= -->
    <h2>2. Raum prüfen</h2>

    <select id="roomWork"></select>
    <select id="roomBuilding"></select>
    <input id="roomInput" placeholder="Raum eingeben (z.B. 2.13)" />
    <button onclick="checkRoom()">Raum prüfen</button>

    <div id="roomResult"></div>

    <!-- ========================= -->
    <h2>3. Daten hinzufügen</h2>

    <h3>Anlage hinzufügen</h3>
    <input id="newSystemId" placeholder="ID (z.B. 26.140.432)" />
    <input id="newSystemType" placeholder="Typ (UV, FI, Zuluft)" />
    <input id="newSystemBuilding" placeholder="Gebäude" />
    <input id="newSystemRoom" placeholder="Raum" />
    <button onclick="addSystem()">Speichern</button>

    <h3>Leuchte hinzufügen</h3>
    <input id="newLightRoom" placeholder="Raum" />
    <input id="newLightType" placeholder="Typ" />
    <button onclick="addLight()">Speichern</button>

    <h3>Log hinzufügen</h3>
    <input id="newLogTarget" placeholder="ID (Anlage oder Leuchte)" />
    <input id="newLogText" placeholder="Beschreibung" />
    <button onclick="addLog()">Speichern</button>

    <!-- ========================= -->
    <h2>4. Backup</h2>

    <button onclick="exportData()">Export</button>
    <input type="file" onchange="importData(event)" />

    <!-- ========================= -->

    <script>
      // ===== Daten =====
      let data = JSON.parse(localStorage.getItem("appData")) || {
        version: 1,
        works: ["59", "50"],
        systems: [],
        lights: [],
        logs: [],
      };

      // ===== Speichern =====
      function saveData() {
        localStorage.setItem("appData", JSON.stringify(data));
      }

      // ===== Dropdowns =====
      function init() {
        const workSelects = ["filterWork", "roomWork"];

        workSelects.forEach((id) => {
          const el = document.getElementById(id);
          el.innerHTML = '<option value="">Werk wählen</option>';
          data.works.forEach((w) => {
            el.innerHTML += `<option value="${w}">${w}</option>`;
          });
        });
      }

      init();

      // ===== 1. Suche =====
      function searchSystems() {
        const text = document.getElementById("searchText").value.toLowerCase();
        const type = document.getElementById("filterType").value;

        const results = data.systems.filter(
          (s) =>
            (!text || s.id.toLowerCase().includes(text)) &&
            (!type || s.type === type),
        );

        const container = document.getElementById("systemResults");
        container.innerHTML = "";

        results.forEach((s) => {
          container.innerHTML += `
      <div class="card">
        <b>${s.id}</b><br>
        Typ: ${s.type}<br>
        Gebäude: ${s.building}<br>
        Raum: ${s.room}
      </div>
    `;
        });
      }

      // ===== 2. Raum prüfen =====
      function checkRoom() {
        const room = document.getElementById("roomInput").value;

        const systems = data.systems.filter((s) => s.room === room);
        const lights = data.lights.filter((l) => l.room === room);

        let html = "<h3>Anlagen</h3>";
        systems.forEach((s) => {
          html += `<div class="card">${s.id} (${s.type})</div>`;
        });

        html += "<h3>Leuchten</h3>";
        lights.forEach((l) => {
          html += `<div class="card">${l.type}</div>`;
        });

        document.getElementById("roomResult").innerHTML = html;
      }

      // ===== 3. Daten hinzufügen =====
      function addSystem() {
        data.systems.push({
          id: document.getElementById("newSystemId").value,
          type: document.getElementById("newSystemType").value,
          building: document.getElementById("newSystemBuilding").value,
          room: document.getElementById("newSystemRoom").value,
        });
        saveData();
        alert("Gespeichert");
      }

      function addLight() {
        data.lights.push({
          room: document.getElementById("newLightRoom").value,
          type: document.getElementById("newLightType").value,
        });
        saveData();
        alert("Gespeichert");
      }

      function addLog() {
        data.logs.push({
          target: document.getElementById("newLogTarget").value,
          text: document.getElementById("newLogText").value,
          date: new Date().toISOString(),
        });
        saveData();
        alert("Log gespeichert");
      }

      // ===== 4. Export =====
      function exportData() {
        const blob = new Blob([JSON.stringify(data)], {
          type: "application/json",
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "backup.json";
        a.click();
      }

      // ===== Import =====
      function importData(event) {
        const file = event.target.files[0];
        const reader = new FileReader();

        reader.onload = function (e) {
          data = JSON.parse(e.target.result);
          saveData();
          alert("Import erfolgreich");
        };

        reader.readAsText(file);
      }
    </script>
  </body>
</html>
