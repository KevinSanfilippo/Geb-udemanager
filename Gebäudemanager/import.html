<!doctype html>
<html lang="dn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gebäudemanager</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>

    <style>
      main {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }

      h1 {
        margin: 10px 30px;
      }
    </style>
  </head>

  <body>
    <header>
      <div class="logo-header">
        <a href="index.html"><img src="./assets/img/logo.png" alt="logo" /></a>
        <p>Gebäudemanager</p>
      </div>
      <nav>
        <a href="./SearchAttachment.html">Anlangen Suchen</a
        ><a href="./roomcheck.html">Räume prüfen</a
        ><a href="./AddAttachment.html">Anlangen Hinzufügen</a
        ><a href="import.html">Import/Export</a>
      </nav>
    </header>

    <main>
      <h1>Seite wird noch bearebeitet, lass den Hussler husseln</h1>
      <button id="toggleBtn">Drück drauf</button>
      <img
        id="text"
        style="display: none"
        src="./assets/img/motivation/006.png"
        alt=""
        width="440px"
        height="500px"
      />

      <script>
        const btn = document.getElementById("toggleBtn");
        const text = document.getElementById("text");

        btn.addEventListener("click", function () {
          if (text.style.display === "none") {
            text.style.display = "block";
          } else {
            text.style.display = "none";
          }
        });
      </script>
    </main>
  </body>
</html>
